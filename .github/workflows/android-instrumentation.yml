# The Android instrumentation suite, kept in its own reusable workflow so it
# can run on a second runner when the first one cannot boot an emulator.
# Hosted runners do not all expose /dev/kvm, and a runner without acceleration
# emulates the whole device in software, which is slow enough to eat the boot
# timeout.
name: Android instrumentation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  first-runner:
    name: Instrumented tests (first runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      emulator: ${{ steps.suite.outputs.emulator-outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run the suite
        id: suite
        uses: ./.github/actions/android-instrumentation

      - name: Report the outcome
        if: steps.suite.outputs.emulator-outcome != 'success'
        run: |
          echo "::warning::The emulator could not run the suite on this runner; the second runner takes over."

  second-runner:
    name: Instrumented tests (second runner)
    needs: first-runner
    if: always() && needs.first-runner.outputs.emulator != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run the suite
        id: suite
        uses: ./.github/actions/android-instrumentation

      - name: Require a green suite
        if: steps.suite.outputs.emulator-outcome != 'success'
        run: |
          echo "The instrumented tests did not run on the second runner either."
          exit 1
