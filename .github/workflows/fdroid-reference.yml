name: F-Droid reproducible reference

# Build and publish a signed reference APK for F-Droid reproducible-build
# verification. This is deliberately separate from the normal v* sideload
# release: the F-Droid flavor has update channels disabled and excludes the
# Capgo native module so its non-free Google Play/Firebase classes stay out of
# the APK.

on:
  workflow_dispatch:
  push:
    tags:
      - 'fdroid-reference-*'

permissions:
  contents: write

concurrency:
  group: fdroid-reference-${{ github.ref }}
  cancel-in-progress: false

env:
  REFERENCE_TAG: fdroid-reference-0.3.6-306
  REFERENCE_APK: radioscout-fdroid-0.3.6-306.apk

jobs:
  build-reference:
    name: Build signed F-Droid reference APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.8.2
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check F-Droid metadata and version
        run: pnpm fdroid:check

      - name: Build the F-Droid flavor
        run: |
          VITE_DISTRIBUTION=fdroid pnpm build
          VITE_DISTRIBUTION=fdroid npx cap sync android
          cd android
          sed -i '/capgo-capacitor-updater/d' capacitor.settings.gradle
          sed -i '/capgo-capacitor-updater/d' app/capacitor.build.gradle
          node -e "const fs=require('fs');const p='app/src/main/assets/capacitor.plugins.json';const a=JSON.parse(fs.readFileSync(p,'utf8'));fs.writeFileSync(p,JSON.stringify(a.filter((x)=>x.pkg!=='@capgo/capacitor-updater'),null,2));"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo '::error::ANDROID_KEYSTORE_BASE64 secret is not set.'
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/radioscout-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/radioscout-release.jks" >> "$GITHUB_ENV"

      - name: Assemble and sign the F-Droid APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          test -f app/build/outputs/apk/release/radioscout-release.apk
          cp app/build/outputs/apk/release/radioscout-release.apk "../$REFERENCE_APK"

      - name: Verify signature and record certificate
        env:
          REFERENCE_APK: ${{ env.REFERENCE_APK }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APK="$GITHUB_WORKSPACE/$REFERENCE_APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          CERT_DIGEST="$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2); exit}' "$RUNNER_TEMP/apksigner.txt")"
          test -n "$CERT_DIGEST"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          {
            echo "### F-Droid reference APK"
            echo
            echo "- APK: \`$REFERENCE_APK\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- SHA-256: \`$SHA256\`"
            echo "- Signer certificate SHA-256: \`$CERT_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "CERT_DIGEST=$CERT_DIGEST" >> "$GITHUB_ENV"
          echo "APK_SHA256=$SHA256" >> "$GITHUB_ENV"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-reference-apk
          path: ${{ env.REFERENCE_APK }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish public reference asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.REFERENCE_TAG }}
          name: F-Droid reproducible reference 0.3.6 (306)
          body: |
            This is the signed F-Droid-specific reference APK for reproducible-build verification.

            It is not the normal sideload/OTA release. The F-Droid flavor disables Capgo OTA, GitHub APK update prompts, and removes the Capgo native module before the Android build.

            - Source commit: `${{ github.sha }}`
            - Application ID: `io.github.double77x.radioscout`
            - Version: `0.3.6`
            - Version code: `306`
            - Asset: `${{ env.REFERENCE_APK }}`
          files: ${{ env.REFERENCE_APK }}
          fail_on_unmatched_files: true
          overwrite_files: true
