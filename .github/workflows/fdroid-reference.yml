name: F-Droid reproducible reference

# Build and publish a signed reference APK for F-Droid reproducible-build
# verification. This is deliberately separate from the normal v* sideload
# release: the F-Droid flavor has update channels disabled and excludes the
# Capgo native module so its non-free Google Play/Firebase classes stay out of
# the APK.
#
# Runs on every v* tag because fdroiddata auto-updates from those tags and
# verifies each build against a reference APK named
# fdroid-reference-<versionName>-<versionCode>. Everything version-shaped is
# read from android/app/build.gradle, which the release flow keeps in step with
# package.json (see scripts/cap-version.js), so publishing a reference for a new
# release needs no edit here.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: fdroid-reference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-reference:
    name: Build signed F-Droid reference APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Resolve reference version
        id: version
        run: |
          set -euo pipefail
          gradle=android/app/build.gradle
          version="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\(.*\)".*/\1/p' "$gradle")"
          versionCode="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$gradle")"
          test -n "$version" || { echo "::error::no versionName in $gradle"; exit 1; }
          test -n "$versionCode" || { echo "::error::no versionCode in $gradle"; exit 1; }
          # A tag that disagrees with the committed Android version would
          # publish a reference F-Droid never looks for. Only meaningful on a tag
          # push: under workflow_dispatch ref_name is a branch, not a release tag.
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match versionName v$version in $gradle"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "versionCode=$versionCode" >> "$GITHUB_OUTPUT"
          echo "referenceTag=fdroid-reference-$version-$versionCode" >> "$GITHUB_OUTPUT"
          echo "apkName=radioscout-fdroid-$version-$versionCode.apk" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.8.2
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check F-Droid metadata and version
        run: pnpm fdroid:check

      - name: Build the F-Droid flavor
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export TZ=UTC
          VITE_DISTRIBUTION=fdroid pnpm exec vp run build
          node scripts/strip-sw.mjs
          node scripts/normalize-ssr-timestamps.mjs dist/client
          VITE_DISTRIBUTION=fdroid npx cap sync android
          node scripts/strip-capgo-plugin.mjs
          cd android
          sed -i '/capgo-capacitor-updater/d' capacitor.settings.gradle
          sed -i '/capgo-capacitor-updater/d' app/capacitor.build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo '::error::ANDROID_KEYSTORE_BASE64 secret is not set.'
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/radioscout-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/radioscout-release.jks" >> "$GITHUB_ENV"

      - name: Assemble and sign the F-Droid APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APK_NAME: ${{ steps.version.outputs.apkName }}
        run: |
          ./gradlew assembleRelease --no-daemon
          test -f app/build/outputs/apk/release/radioscout-release.apk
          cp app/build/outputs/apk/release/radioscout-release.apk "../$APK_NAME"

      - name: Verify signature and record certificate
        env:
          APK_NAME: ${{ steps.version.outputs.apkName }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APK="$GITHUB_WORKSPACE/$APK_NAME"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          CERT_DIGEST="$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2); exit}' "$RUNNER_TEMP/apksigner.txt")"
          test -n "$CERT_DIGEST"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          {
            echo "### F-Droid reference APK"
            echo
            echo "- APK: \`$APK_NAME\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- SHA-256: \`$SHA256\`"
            echo "- Signer certificate SHA-256: \`$CERT_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "CERT_DIGEST=$CERT_DIGEST" >> "$GITHUB_ENV"
          echo "APK_SHA256=$SHA256" >> "$GITHUB_ENV"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-reference-apk
          path: ${{ steps.version.outputs.apkName }}
          if-no-files-found: error
          retention-days: 30

      # Explicit gh release calls rather than softprops/action-gh-release. That
      # action reconciles an existing release against the *current* git ref, so
      # it only worked while this workflow ran from an fdroid-reference-* tag
      # where ref == tag_name. Now that it runs from a v* tag (or a dispatch
      # branch) the two differ and the action fails with an HttpError on an
      # already-published reference. These calls address the release by name.
      - name: Publish public reference asset
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE_TAG: ${{ steps.version.outputs.referenceTag }}
          APK_NAME: ${{ steps.version.outputs.apkName }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
        run: |
          set -euo pipefail
          title="F-Droid reproducible reference $VERSION ($VERSION_CODE)"
          notes="$(printf '%s\n' \
            'This is the signed F-Droid-specific reference APK for reproducible-build verification.' \
            '' \
            'It is not the normal sideload/OTA release. The F-Droid flavor disables Capgo OTA, GitHub APK update prompts, and removes the Capgo native module before the Android build.' \
            '' \
            "- Source commit: \`$GITHUB_SHA\`" \
            '- Application ID: `io.github.double77x.radioscout`' \
            "- Version: \`$VERSION\`" \
            "- Version code: \`$VERSION_CODE\`" \
            "- Asset: \`$APK_NAME\`")"
          if gh release view "$REFERENCE_TAG" >/dev/null 2>&1; then
            gh release edit "$REFERENCE_TAG" --title "$title" --notes "$notes"
          else
            git tag "$REFERENCE_TAG" "$GITHUB_SHA"
            git push origin "$REFERENCE_TAG"
            gh release create "$REFERENCE_TAG" --prerelease --title "$title" --notes "$notes"
          fi
          gh release upload "$REFERENCE_TAG" "$APK_NAME" --clobber
