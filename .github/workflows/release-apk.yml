# Release APK — tag a version, get a signed downloadable APK on the GitHub Release.
#
# Usage: bump `version` in package.json, commit, then
# `git tag vX.Y.Z && git push origin vX.Y.Z`. Tagging is the deliberate
# release act: every `v*` tag builds the release-signed APK from that commit
# and attaches it to the release. `workflow_dispatch` builds without publishing.
#
# The app is local-only (no backend), so the build needs no env vars beyond
# the release-signing secrets below.
#
# Signing: one keystore, created once and kept forever (losing or changing it
# forces every user to reinstall). Secrets required on tag builds:
# ANDROID_KEYSTORE_BASE64 (base64 of the .jks), ANDROID_KEY_ALIAS,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD.
# Action pins are kept current by Dependabot (.github/dependabot.yml).

name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG — bump the version first (see docs/CAPACITOR_PLAN.md M3)."
            exit 1
          fi

      - name: Build web + sync + stamp version
        run: |
          pnpm build
          npx cap sync android
          node scripts/cap-version.js

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — create the keystore and add CI secrets (see docs/CAPACITOR_PLAN.md M5)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/radioscout-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/radioscout-release.jks" >> "$GITHUB_ENV"

      - name: Assemble release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test -f android/app/build/outputs/apk/release/radioscout-release.apk
          cp android/app/build/outputs/apk/release/radioscout-release.apk "radioscout-${GITHUB_REF_NAME}.apk"

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: radioscout-v*.apk
          generate_release_notes: true
