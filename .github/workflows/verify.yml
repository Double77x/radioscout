# Every push to main and every pull request runs the web checks. The native
# suite is expensive and only matters when the APK can change, so it runs on a
# release tag or when a change touches the Android shell, its build inputs or
# a native Capacitor dependency. Device-only checks live in
# `android-device-smoke.yml`: they need a real Android runtime and must not
# block a normal pull request.
name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Native change detection
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.detect.outputs.android }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect native changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          # A release tag always builds an APK. A manual dispatch is a
          # deliberate full check, so it takes the same path.
          if [[ "$GITHUB_REF_TYPE" == "tag" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
              range="HEAD^"
            else
              range="$before...HEAD"
            fi
          fi

          if ! files="$(git diff --name-only "$range")"; then
            # If the range cannot be resolved, run the suite rather than
            # silently treating a native change as web-only.
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          native=false
          if grep -Eq '^(android/|assets/|capacitor\.config\.|scripts/(cap-version\.js|strip-sw\.mjs|generate-native-assets\.mjs))' <<<"$files"; then
            native=true
          fi

          # A change to the workflow that runs the native gate must exercise it.
          if grep -Eq '^\.github/workflows/(verify|release-apk|android-instrumentation)\.yml$' <<<"$files"; then
            native=true
          fi

          # Package and lockfile bumps are web-only unless they move a
          # Capacitor/Capgo package, which changes the native shell.
          if git diff "$range" -- package.json pnpm-lock.yaml | grep -Eq '^[+-].*(@capacitor|@capgo)'; then
            native=true
          fi

          echo "android=$native" >> "$GITHUB_OUTPUT"

  web:
    name: Web, unit and e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Unit tests
        run: pnpm test:unit

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Build the static site
        run: pnpm exec vp run build

      - name: Dead-code and dependency audit
        run: pnpm fallow

  android-jvm:
    name: Native JVM tests and R8 build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native web assets
        run: |
          pnpm cap:android
          pnpm cap:version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: JVM tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble the release-shaped APK
        working-directory: android
        run: ./gradlew assembleReleaseTest --no-daemon

  android-instrumentation:
    name: Android instrumentation
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android-instrumentation.yml
    continue-on-error: true

  # Hosted runners do not all expose /dev/kvm, and a runner without it cannot
  # boot an emulator inside the timeout. The first attempt is tolerated so a
  # second runner gets a turn; only that second failure blocks the release.
  android-instrumentation-retry:
    name: Android instrumentation (second runner)
    needs: [changes, android-instrumentation]
    if: always() && needs.changes.outputs.android == 'true' && needs.android-instrumentation.result == 'failure'
    uses: ./.github/workflows/android-instrumentation.yml
