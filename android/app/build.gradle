apply plugin: 'com.android.application'

// Release signing comes from CI secrets (ANDROID_KEYSTORE_* env — see
// .github/workflows/release-apk.yml). Without them the release stays
// unsigned and local installs should use `assembleDebug` instead.
def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_FILE")
// Generated on demand; never committed. The fixture CA is only merged into
// debug and releaseTest resources.
def fixtureCaResDir = new File(layout.buildDirectory.get().asFile, "generated/fixtureCa/res")

android {
    namespace = "io.github.double77x.radioscout"
    compileSdk = rootProject.ext.compileSdkVersion
    // F-Droid rejects APKs with extra signing blocks, and AGP 8 embeds a
    // "Dependency metadata" block by default — keep it out of every bundle.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    // Artifact name: radioscout-debug.apk / radioscout-release.apk (default would be app-*.apk).
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "radioscout-${variant.buildType.name}.apk"
        }
    }
    defaultConfig {
        applicationId "io.github.double77x.radioscout"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 406
        versionName "0.4.6"
        // Only the release-shaped test variant flips this on. Debug builds
        // already enable WebView debugging through Capacitor.
        buildConfigField "boolean", "WEBVIEW_DEBUG", "false"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            // F-Droid requires R8 shrinking (APK size). Capacitor, Media3 and
            // Guava ship consumer keep rules; the reflective Bridge plugin
            // methods below live in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
        }
        // Release-shaped build for device smoke: same R8/shrinking and web
        // assets as release, still non-debuggable, debug-signed so the fixture
        // CA can be trusted, and WebView debugging explicitly enabled through
        // BuildConfig so Playwright can attach. Never publish this variant.
        releaseTest {
            initWith(buildTypes.getByName('release'))
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            buildConfigField "boolean", "WEBVIEW_DEBUG", "true"
        }
    }
    buildFeatures {
        buildConfig true
    }
    sourceSets {
        // The loopback trust config lives in src/debug/res; the CA itself is
        // generated into the build directory and reused by releaseTest.
        debug {
            res.srcDir(fixtureCaResDir)
        }
        releaseTest {
            res.srcDirs += [fixtureCaResDir, 'src/debug/res']
        }
    }
    testOptions {
        // The leveling JVM tests drive queueInput directly, and its settle
        // path logs via android.util.Log — return stub defaults (silent)
        // instead of the not-mocked exceptions.
        unitTests.returnDefaultValues = true
    }
}

def fixtureCaFile = new File(fixtureCaResDir, "raw/android_fixture_ca.pem")
def generateFixtureCerts = tasks.register("generateFixtureCerts", Exec) {
    group = "build"
    description = "Generate the uncommitted Android smoke fixture CA"
    workingDir rootProject.projectDir.parentFile
    commandLine "node", "scripts/android-fixture-certs.mjs", "--ca-out", fixtureCaFile.absolutePath
    inputs.file rootProject.file("../scripts/android-fixture-certs.mjs")
    outputs.files(
        fixtureCaFile,
        rootProject.file("../tests/fixtures/android/.generated/fixture-ca.pem"),
        rootProject.file("../tests/fixtures/android/.generated/fixture-server.p12")
    )
}
// Anchor generation to the variant pre-build so every resource task sees the
// generated CA before it reads the source set.
tasks.configureEach { task ->
    if (task.name == "preDebugBuild" || task.name == "preReleaseTestBuild") {
        task.dependsOn generateFixtureCerts
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Foreground-service player (lock-screen / shade / headset / Auto).
    def media3Version = "1.9.0"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
