# Fallow dead-code/duplication config. TOML is preferred for comments.
# Auto-discovers project files (no `entry` needed) and Vite/TanStack plugins.

ignorePatterns = [
  "**/*.d.ts",
  "scripts/**", # invoked by package.json scripts / docs, not by import
  "src/routeTree.gen.ts",
  "src/components/ui/**", # shadcn registry files, replaced wholesale by `shadcn add`
  "public/**", # runtime-loaded workers/service-worker, never imported
  "dist/**", # build output
  "android/**", # native shell + `cap sync` copy of dist
  ".wrangler/**",
]
ignoreDependencies = [
  "tailwindcss-animate", # used via @import in CSS, not a JS import
  "tailwindcss", # used via @tailwindcss/vite + @import "tailwindcss" — not runtime
  "@base-ui/react", # only imported from src/components/ui/**, which is ignorePatterns-silenced
  "class-variance-authority", # same — button-variants under src/components/ui/**
  "react-doctor", # used via lint.jsPlugins in toolchain.config.ts — not a JS import
  "eslint-plugin-react-doctor", # same — oxlint jsPlugins in toolchain.config.ts
  "eslint-plugin-better-tailwindcss", # same — jsPlugins entry, and its rules do fire
  "eslint-plugin-react-hooks", # same — referenced as a { name, specifier } jsPlugins entry
  "eslint-plugin-react-refresh", # same — jsPlugins entry
  "eslint-plugin-react-you-might-not-need-an-effect", # same — referenced as a { name, specifier } jsPlugins entry
  "oxc-transform-react", # loaded by @vitejs/plugin-react when `compiler: true`; never imported
  "sharp", # only imported from scripts/** (native asset compositing) — see above
  "png-to-ico", # same — one-off icon generation output is committed
  "adm-zip", # same — OTA bundle zipping in publish-ota.mjs
  "workbox-build", # same — service-worker generation in generate-sw.mjs
  "@capacitor/assets", # invoked via `npx @capacitor/assets` in generate-native-assets.mjs
  "@capacitor/cli", # invoked via `npx cap` scripts, never imported
  "@capacitor/android", # native platform shell (gradle side), never imported in TS
  "@capacitor/keyboard", # configured in capacitor.config.ts; implementation ships with the native shell
  "@tanstack/react-start", # framework entry (Start plugin + route tree), not a test-only dep
  "vite-plugin-pwa", # installed but deliberately unwired: the verified offline path is scripts/generate-sw.mjs (docs/standards/TECH_STACK.md)
  "wrangler", # invoked via the `preview` script, never imported
  "@playwright/test", # e2e specs + the native WebView probe script
]
ignoreExportsUsedInFile = true
production = false

[rules]
unused-files = "error"
unused-exports = "warn"
unused-types = "off"
private-type-leaks = "off"
unresolved-imports = "error"
css-token-drift = "off"
css-dead-surface = "off"
css-selector-complexity = "off"

[duplicates]
mode = "mild"
minTokens = 50
minLines = 40
threshold = 4

[health]
maxCyclomatic = 100
maxCognitive = 100
ignore = ["**/*"]

[audit]
gate = "new-only"
